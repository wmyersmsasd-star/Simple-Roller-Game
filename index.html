<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROLLER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>ROLLER</h1>

  <canvas id="game" width="800" height="400"></canvas>

  <p id="message">Loading...</p>
  <div id="hud">Health: 100 / 100</div>

  <div class="stage-tools">
    <div class="creator-brushes">
      <button class="creator-brush active" data-brush="#" type="button">Block</button>
      <button class="creator-brush" data-brush="^" type="button">Spike</button>
      <button class="creator-brush" data-brush="F" type="button">Win Pad</button>
      <button class="creator-brush" data-brush="." type="button">Erase</button>
    </div>
  </div>

  <p class="controls">
    LEFT / RIGHT arrow to roll &nbsp;&middot;&nbsp;
    SPACE or UP arrow to jump &nbsp;&middot;&nbsp;
    X + LEFT / RIGHT to dash &nbsp;&middot;&nbsp;
    R to restart
  </p>

  <!-- ===================================================================
       THE ORDER OF THESE FILES MATTERS. Each one uses the ones above it.
       If you add a new file, add it to this list too, in the right spot.
       =================================================================== -->
  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/level.js"></script>
  <script src="js/collide.js"></script>
  <script src="js/player.js"></script>
  <script src="js/dash.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
